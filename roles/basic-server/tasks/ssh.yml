---
- name: Configure SSH - PasswordAuthentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication {{ ssh_enable_passwd_auth }}"
  notify: reload ssh

- name: Configure SSH - PermitRootLogin
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin {{ ssh_enable_root_login }}"
  notify: reload ssh

- name: Configure SSH - UseDNS
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?UseDNS"
    line: "UseDNS {{ ssh_use_dns }}"
  notify: reload ssh
